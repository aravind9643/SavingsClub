<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f4e79"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Central Pot / Vault Icon -->
  <circle cx="256" cy="270" r="140" fill="#14243b" stroke="#334155" stroke-width="8"/>
  <ellipse cx="256" cy="180" rx="90" ry="24" fill="#1e293b" stroke="#475569" stroke-width="6"/>
  <!-- Rupee Symbol on Front -->
  <path d="M226 230 h60 M226 254 h60 M226 230 v80 M248 230 c20 0 34 10 34 24 0 14 -12 24 -34 24 M244 278 l38 48" 
        stroke="#10b981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Glowing Coin Entering Pot -->
  <circle cx="256" cy="120" r="32" fill="url(#gold)" stroke="#fef3c7" stroke-width="4"/>
  <text x="256" y="128" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#78350f" text-anchor="middle">₹</text>
</svg>
