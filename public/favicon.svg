<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Midnight Gradient -->
    <linearGradient id="scBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="scRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ddc97" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Central Radial Emerald Glow -->
    <radialGradient id="scGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="65%" stop-color="#059669" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Vault Bezel Gradient -->
    <linearGradient id="scBezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Vault Chamber Core Gradient -->
    <linearGradient id="scCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Handle Spokes Gradient -->
    <linearGradient id="scHandle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#3ddc97"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glass Flare Sheen -->
    <linearGradient id="scGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Vault Body -->
    <filter id="scShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="scNeon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="116" fill="url(#scBg)"/>
  <rect width="512" height="512" rx="116" fill="none" stroke="url(#scRim)" stroke-width="4"/>

  <!-- Radial Emerald Halo -->
  <circle cx="256" cy="256" r="190" fill="url(#scGlow)"/>

  <!-- Vault Outer Shield / Bezel -->
  <circle cx="256" cy="256" r="148" fill="url(#scBezel)" stroke="#475569" stroke-width="3" filter="url(#scShadow)"/>
  <circle cx="256" cy="256" r="136" fill="none" stroke="#0f172a" stroke-width="5"/>

  <!-- Perimeter Vault Rivets / Bolts (8 bolts) -->
  <circle cx="256" cy="122" r="7" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
  <circle cx="351" cy="161" r="7" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
  <circle cx="390" cy="256" r="7" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
  <circle cx="351" cy="351" r="7" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
  <circle cx="256" cy="390" r="7" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
  <circle cx="161" cy="351" r="7" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
  <circle cx="122" cy="256" r="7" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
  <circle cx="161" cy="161" r="7" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>

  <!-- Inner Vault Door Cavity -->
  <circle cx="256" cy="256" r="114" fill="#090d16" stroke="#3ddc97" stroke-width="3" stroke-dasharray="8 5" opacity="0.85"/>
  <circle cx="256" cy="256" r="105" fill="url(#scCore)"/>

  <!-- Vault Wheel Spokes / Handles -->
  <!-- Horizontal handle -->
  <rect x="180" y="246" width="152" height="20" rx="10" fill="url(#scHandle)" filter="url(#scNeon)"/>
  <!-- Vertical handle -->
  <rect x="246" y="180" width="20" height="152" rx="10" fill="url(#scHandle)" filter="url(#scNeon)"/>
  <!-- Diagonal handles (45 deg) -->
  <g transform="rotate(45 256 256)">
    <rect x="190" y="248" width="132" height="16" rx="8" fill="url(#scHandle)" opacity="0.9"/>
    <rect x="248" y="190" width="16" height="132" rx="8" fill="url(#scHandle)" opacity="0.9"/>
  </g>

  <!-- Central Dial Hub -->
  <circle cx="256" cy="256" r="54" fill="url(#scBezel)" stroke="#3ddc97" stroke-width="4"/>
  <circle cx="256" cy="256" r="45" fill="#090d16"/>

  <!-- Iconic Rupee Emblem in Center -->
  <path d="M 238 234 L 274 234 M 238 246 L 270 246 M 238 234 L 238 278 M 248 234 C 265 234, 274 242, 274 252 C 274 262, 263 268, 248 268 M 246 268 L 274 286"
        fill="none" stroke="#3ddc97" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top-Right Sparkling Diamond Star -->
  <path d="M 374 100 Q 374 116 390 116 Q 374 116 374 132 Q 374 116 358 116 Q 374 116 374 100 Z" fill="#6ee7b7" opacity="0.9" filter="url(#scNeon)"/>

  <!-- Diagonal Glass Glare Reflection -->
  <path d="M 0 116 C 0 52, 52 0, 116 0 L 256 0 L 0 256 Z" fill="url(#scGlass)"/>
</svg>
